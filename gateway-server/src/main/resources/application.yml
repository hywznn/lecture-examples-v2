spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 라우트 1: 주문 — /orders 로 시작하는 요청은 order-service 로
            - id: order-route
              uri: http://localhost:8080
              predicates:
                - Path=/orders/**

server:
  port: 8000

  # 라우팅 테이블 확인용 액추에이터 엔드포인트
  management:
    endpoint:            # (단수) 개별 엔드포인트의 설정
      gateway:
        access: read-only   # SCG 5.0 부터 gateway 엔드포인트는 기본 차단 — 조회 전용으로 연다
    endpoints:           # (복수) 엔드포인트 노출 설정
      web:
        exposure:
          include: gateway
